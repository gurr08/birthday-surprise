<!DOCTYPE html>
<html>
<head>
<title>Birthday Surprise 🎂</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffd6e8,#d9c7ff);
  overflow:hidden;
}

.card{
  width:90%;
  max-width:420px;
  padding:40px 25px;
  text-align:center;
  background:rgba(255,255,255,0.9);
  border-radius:30px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.emoji{
  font-size:65px;
}

h1{
  color:#ff4f91;
  font-size:38px;
  margin:15px 0;
}

p{
  color:#555;
  font-size:18px;
  line-height:1.6;
}

button{
  border:none;
  padding:15px 28px;
  border-radius:30px;
  background:#ff4f91;
  color:white;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(255,79,145,.4);
}

button:active{
  transform:scale(.95);
}

#surprise{
  display:none;
  margin-top:25px;
  animation:fade 1s ease;
}

.heart{
  font-size:30px;
  animation:beat 1s infinite;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes beat{
  50%{transform:scale(1.3);}
}

  animation:float 4s infinite ease-in-out;
}
